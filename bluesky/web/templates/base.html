<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}bluesky{% endblock %} · bluesky</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232563eb'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-dot"></span>bluesky
        <small>bt-audit</small>
      </a>
      <nav class="topnav">
        <a href="/" class="{{ 'active' if request.path == '/' }}">Dashboard</a>
        <a href="/modules" class="{{ 'active' if request.path.startswith('/modules') }}">Módulos</a>
        <a href="/scan" class="{{ 'active' if request.path == '/scan' }}">Escaneo</a>
        <a href="/sessions" class="{{ 'active' if request.path == '/sessions' }}">Sesiones</a>
        <a href="/reports" class="{{ 'active' if request.path == '/reports' }}">Reportes</a>
        <a href="/logs" class="{{ 'active' if request.path == '/logs' }}">Logs</a>
        <a href="/api" class="{{ 'active' if request.path == '/api' }}">API</a>
        <a href="/about" class="{{ 'active' if request.path == '/about' }}">Acerca</a>
      </nav>
      <div class="topbar-right">
        <span class="pill"><span class="dot" data-status-dot></span><span data-status-text>—</span></span>
      </div>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    bluesky — Bluetooth Security Auditing Framework · uso exclusivo en auditorías autorizadas ·
    <code>v<span data-version>{{ version | default('0.2.0') }}</span></code>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
